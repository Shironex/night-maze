# THIS WORKFLOW HAS NEVER RUN.
#
# It was written while the repository was private and before the first tag.
# Nothing in it has been executed on a GitHub runner: not the builds, not the
# `if:` conditions, not the publish step. The scripts it calls were run on a
# developer machine (Windows) and have tests, and this file was parsed as YAML.
# Expect to fix something on the first real run, and read the result before
# sending the link to anyone.
#
# What it does: it runs by hand only. You give it an existing tag
# `v<major>.<minor>.<patch>`; it builds the game for Windows (and, if you ask,
# for macOS on Apple Silicon), packs each build into a zip, and creates a DRAFT
# GitHub Release holding the zips, `manifest.json` and `news.json`. The two json
# files are NOT signed here. The launcher reads
# `https://github.com/<owner>/<repo>/releases/latest/download/manifest.json` and
# refuses a manifest without a valid signature, so the owner signs the two files
# on his own PC (the key never goes to GitHub), uploads the two `.sig` files and
# only then publishes the draft. A draft is never "latest", so the launcher
# cannot see a release that is still half finished. The commands are in the
# comment above the "Create the release" step.
#
# The launcher installer is not built here, see the end of this file.
#
# The repository has to be public for the launcher to download from it without
# a token.
#
# If something fails after the draft exists: delete the draft release (not the
# tag), fix the problem, and run the workflow again for the same tag. A run uses
# this file as it is on the branch you pick under "Use workflow from", but it
# builds the code of the tag.

name: release

# There is no `push: tags` trigger on purpose. While the repository is private
# every run is paid minutes, and pushing a tag must not start a release by
# itself until the owner decides the repository is public and the signing steps
# above work. To bring the tag trigger back, add under `on:`
#     push:
#       tags: ['v*']
# and then make the `tag` input fall back to the pushed tag: use
# `${{ inputs.tag || github.ref_name }}` where `inputs.tag` is used below (the
# concurrency group, the checkout steps and the TAG_INPUT variable), and
# `${{ github.event_name != 'workflow_dispatch' || inputs.macos }}` in the
# `if:` of the macOS job.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag to build and release, for example v0.10.0. It must exist already and equal v plus the version in CMakeLists.txt'
        type: string
        required: true
      macos:
        description: 'Also build the macOS package'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Builds the code of the tag from the input, whatever branch the workflow
      # file itself was taken from. `refs/tags/` makes a missing tag, or a
      # branch with the same name, fail here instead of building the wrong code.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag }}

      # The version has one source: project(NightMaze VERSION ...) in CMakeLists.txt.
      # A tag that says something else stops the release in its first minute.
      # The input goes through an environment variable, not into the script
      # text, so a strange tag name cannot become a command.
      - name: Read the version and compare it with the tag
        id: version
        shell: bash
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          version="$(sed -n 's/^project(NightMaze VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt)"
          if [ -z "$version" ]; then
            echo "::error::Could not read the version from CMakeLists.txt"
            exit 1
          fi
          if [ "${TAG_INPUT}" != "v${version}" ]; then
            echo "::error::Tag ${TAG_INPUT} does not match version ${version} in CMakeLists.txt"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Cache the downloaded dependencies
        uses: actions/cache@v6
        with:
          path: build/release/_deps
          key: deps-windows-${{ hashFiles('cmake/Dependencies.cmake') }}

      # Static C++ runtime, for the release package only: the exe then needs no
      # Visual C++ redistributable on a friend's PC. The first variable switches
      # the game and Dear ImGui to /MT, the second tells GLFW to do the same.
      # Measured locally on 2026-10-06 with MSVC from Build Tools 2022: the
      # build links, the tests pass, and `dumpbin /dependents` lists no
      # VCRUNTIME or MSVCP DLL.
      - name: Configure
        run: cmake --preset release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DUSE_MSVC_RUNTIME_LIBRARY_DLL=OFF

      - name: Build
        run: cmake --build --preset release

      - name: Unit tests
        run: ctest --test-dir build/release -C Release --output-on-failure

      # The packaging scripts use zlib.crc32, which needs Node 22.
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Tests of the packaging scripts
        run: node --test launcher/scripts/lib/feed.test.mjs

      # Assets and the notices file come from the repository, not from the
      # build directory.
      - name: Package
        shell: bash
        run: |
          node launcher/scripts/package-game.mjs \
            --exe build/release/Release/night_maze.exe \
            --version "${{ steps.version.outputs.version }}" \
            --platform windows-x64 \
            --out dist-release

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: package-windows-x64
          path: dist-release/*.zip
          if-no-files-found: error
          retention-days: 1

  macos:
    name: macOS arm64
    # Off by default: the first friend release is Windows only.
    if: ${{ inputs.macos }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Read the version
        id: version
        run: |
          version="$(sed -n 's/^project(NightMaze VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt)"
          test -n "$version"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Cache the downloaded dependencies
        uses: actions/cache@v6
        with:
          path: build/release/_deps
          key: deps-macos-${{ hashFiles('cmake/Dependencies.cmake') }}

      # Without a deployment target the binary only starts on the macOS version
      # of the runner or newer.
      - name: Configure
        run: cmake --preset release -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Build
        run: cmake --build --preset release

      - name: Unit tests
        run: ctest --test-dir build/release --output-on-failure

      # Apple Silicon refuses unsigned code. The linker signs ad hoc already;
      # signing again as the last step before packing makes sure nothing after
      # the link left a stale signature.
      - name: Ad hoc signature
        run: |
          codesign --force --sign - build/release/night_maze
          codesign --verify --verbose build/release/night_maze

      # The packaging scripts use zlib.crc32, which needs Node 22.
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # build/release/assets is a link into the checkout on macOS, so the
      # packager reads the assets folder of the repository itself.
      - name: Package
        run: |
          node launcher/scripts/package-game.mjs \
            --exe build/release/night_maze \
            --version "${{ steps.version.outputs.version }}" \
            --platform macos-arm64 \
            --out dist-release

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: package-macos-arm64
          path: dist-release/*.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish the release
    needs: [windows, macos]
    # One job creates the release, so two jobs cannot race to create it. A
    # skipped macOS job would skip this job as well, so the condition is spelled
    # out: Windows must have succeeded and macOS must not have failed.
    if: ${{ !cancelled() && needs.windows.result == 'success' && needs.macos.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.windows.outputs.version }}
      TAG: v${{ needs.windows.outputs.version }}
    steps:
      # The tag is fetched too, because the release title below is read from
      # the tag message.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Download the packages
        uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true

      # The files are named after the tag, so the URLs in the manifest are the
      # permanent ones of this release, not the moving "latest" address.
      # CHANGELOG.md is optional: without a section for this version the notes
      # carry the version, the date and the tag message.
      # `--no-sign`: for a github.com address build-feed.mjs refuses to run
      # without a key or this flag. The signing key never goes to GitHub, so the
      # files leave this job unsigned (no .sig files). The owner signs them on
      # his PC before the release is published, see the next step.
      - name: Write manifest.json and news.json
        run: |
          node launcher/scripts/build-feed.mjs \
            --dir release-assets \
            --version "${VERSION}" \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/" \
            --changelog CHANGELOG.md \
            --no-sign \
            --title "$(git tag -l --format='%(contents:subject)' "${TAG}")"
          cat release-assets/manifest.json

      # A DRAFT, on purpose. Only a published, normal release can become
      # "latest", which is the address the launcher reads, and the launcher
      # needs the two signature files that are not here yet. Nobody sees a
      # draft but the people with write access to the repository. The download
      # links inside manifest.json start to work when the draft is published.
      #
      # What the owner does next, on his PC, in a checkout of the repository
      # with `pnpm install` done in launcher/ (the key password goes in the
      # environment variable TAURI_SIGNING_PRIVATE_KEY_PASSWORD):
      #
      #   gh release download <tag> --repo Shironex/night-maze --pattern "*.json" --dir build/sign
      #   node launcher/scripts/sign-file.mjs --file build/sign/manifest.json --key <path to manifest-a.key>
      #   node launcher/scripts/sign-file.mjs --file build/sign/news.json --key <path to manifest-a.key>
      #   cargo run --manifest-path launcher/Cargo.toml -p night-maze-launcher-core --example verify_manifest -- build/sign/manifest.json
      #   gh release upload <tag> build/sign/manifest.json.sig build/sign/news.json.sig --repo Shironex/night-maze
      #   gh release edit <tag> --repo Shironex/night-maze --draft=false --latest
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Night Maze ${VERSION}" \
            --notes "Install and update through the Night Maze launcher. The zip files are the same builds the launcher downloads." \
            --draft \
            --verify-tag \
            release-assets/*.zip release-assets/manifest.json release-assets/news.json

  # The launcher installer is not built here. It is released from a second,
  # public repository, Shironex/night-maze-launcher, and the first releases are
  # built on the owner's PC. This repository only holds the game releases, so
  # "latest" here always means the newest game release and the manifest address
  # keeps resolving.
